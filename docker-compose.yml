services:
  users:
    build: .
    env_file:
      - .env
    container_name: users
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
    command: npm start

  postgres:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    container_name: postgres-db
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
